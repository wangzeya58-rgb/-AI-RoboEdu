# HTTPS template. Replace domain/certificate paths; review existing virtual hosts
# before installing. Do not install alongside edu-platform.simple.conf.
# Never alias COURSE_FILE_STORAGE_DIR or cache authenticated APIs.
upstream edu_platform_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}
server {
    listen 80;
    server_name edu.example.com;
    return 301 https://edu.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name edu.example.com;
    ssl_certificate /etc/nginx/ssl/edu-platform/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/edu-platform/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    charset utf-8;
    # Default application file limit: 50 MiB plus multipart overhead.
    client_max_body_size 51m;
    client_body_timeout 120s;
    location ~ /\.(?!well-known) { deny all; }
    location / {
        proxy_pass http://edu_platform_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
    }
    access_log /var/log/nginx/edu-platform.access.log;
    error_log /var/log/nginx/edu-platform.error.log warn;
}
