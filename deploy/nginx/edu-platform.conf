# =============================================================
#  智能AI小车实训教育平台 - Nginx 反向代理配置
# =============================================================
#  路径：/etc/nginx/conf.d/edu-platform.conf
#  作用：
#    1) 前端静态资源（.next/static + public）由 Nginx 直接返回
#    2) 以 /api 开头的请求 → 反向代理到后端 Node 服务（端口 5000）
#    3) 其它路径 → fallback 到后端的 SSR/HTML 渲染
#    4) 统一解决跨域（CORS）、Gzip、HTTPS、限流、缓存
#
#  使用：
#    sudo cp deploy/nginx/edu-platform.conf /etc/nginx/conf.d/
#    sudo nginx -t
#    sudo systemctl reload nginx
# =============================================================

# ---------- upstream：后端 Node 服务 ----------
# Next.js 16 (pnpm start) 默认监听 5000 端口（从 .coze 注入的 DEPLOY_RUN_PORT）
upstream edu_platform_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ---------- server：HTTP 入口（生产建议 80 跳 443） ----------
server {
    listen       80;
    server_name  your-domain.com www.your-domain.com;

    # 阿里云 ECS 上建议绑定内网 IP 防外网直接打到 Node
    # listen  172.31.xx.xx:80;

    # 统一字符集
    charset utf-8;

    # ---------- 1) 访问 / 健康检查 ----------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- 2) 反向代理：所有 /api 请求 → 后端 Node ----------
    location /api/ {
        proxy_pass         http://edu_platform_backend;   # 末尾无 / → 原样转发 /api/v1/xxx
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 超时
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 关闭缓冲（流式响应 SSE 必需）
        proxy_buffering       off;
        proxy_request_buffering off;

        # CORS 兜底（next.config 已带，这里再加固一次）
        add_header Access-Control-Allow-Origin      * always;
        add_header Access-Control-Allow-Methods     "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Content-Type, Authorization, x-user-id, x-user-role, x-session" always;
        add_header Access-Control-Max-Age           86400 always;

        # 预检直接 204
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ---------- 3) Next.js 静态资源（.next/static） ----------
    #   强缓存 1 年，由文件名 hash 自动失效
    location /_next/static/ {
        alias /www/wwwroot/edu-platform/backend/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------- 4) public 目录（/favicon.ico / 静态图） ----------
    location ~* ^/(favicon\.ico|robots\.txt|.*\.(?:png|jpg|jpeg|gif|webp|svg|ico|css|js|map|woff2?))$ {
        root /www/wwwroot/edu-platform/frontend/public;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ---------- 5) 其它路径 → fallback 到后端 Next.js 渲染 ----------
    location / {
        proxy_pass         http://edu_platform_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # 防止 .next 之类的隐藏文件被直接访问
        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # ---------- 6) 日志 ----------
    access_log /var/log/nginx/edu-platform.access.log;
    error_log  /var/log/nginx/edu-platform.error.log warn;

    # ---------- 7) 性能：Gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # ---------- 8) 上传大小限制（教学资源 / 视频上传可调大） ----------
    client_max_body_size 500M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
}

