# =============================================================
#  智能AI小车实训教育平台 - 极简版 Nginx 配置
# =============================================================
#  仅限本地开发或受信 HTTPS 终止代理之后；不可直接用于正式公网 HTTP。
#  正式 HTTPS 入口使用 edu-platform.conf。正式 Session Cookie 要求 HTTPS。
#  路径：/etc/nginx/conf.d/edu-platform.conf
#
#  与完整版区别：
#    - 不含 HTTPS 段（独立文件按需启用）
#    - 静态资源直接代理到后端 Next.js（简单可靠，不易踩坑）
#    - 适合“先跑通再优化”的快速上线
# =============================================================

upstream edu_platform_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;   # 任意域名，生产改成 your-domain.com

    charset utf-8;

    # ---- 反向代理：/api 全部走后端 ----
    location /api/ {
        proxy_pass         http://edu_platform_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;
        client_max_body_size 500M;
    }

    # ---- 其它：根路径走 Next.js 渲染 ----
    location / {
        proxy_pass         http://edu_platform_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        client_max_body_size 500M;
    }

    access_log /var/log/nginx/edu-platform.access.log;
    error_log  /var/log/nginx/edu-platform.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
}
